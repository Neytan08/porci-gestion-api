name: Unit Tests and Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run integration tests against the initialized dedicated test database
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run generate
      - name: Type Check Application
        run: npm run typecheck
      - name: Type Check Tests
        run: npm run typecheck:tests
      - name: Lint Code
        run: npm run lint
      - name: Run Unit Tests
        run: npm run test:unit
      - name: Build API
        run: npm run build
